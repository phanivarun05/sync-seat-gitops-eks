# ==========================================================
# Development Environment (Kind)
# ==========================================================

global:
  namespace: sync-seat

  imagePullPolicy: Always

  storageClass: standard

  environment: 
    name: development
    type: development

# ==========================================================
# Infrastructure
# ==========================================================

postgres:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi


redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 150m
      memory: 128Mi

