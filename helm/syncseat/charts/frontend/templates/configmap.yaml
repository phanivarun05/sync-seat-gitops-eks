apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "frontend.fullname" . }}-nginx-config
  labels:
    {{- include "frontend.labels" . | nindent 4 }}
data:
  nginx.conf: |
    server {
        listen 80;
        server_name localhost;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # Simplified in-cluster CoreDNS proxy tracking block
        location /api/ {
            # FIX: Use the native short-form Service name mapped inside your namespace
            proxy_pass http://api-gateway:4000/;
            
            proxy_set_header Origin "http://localhost:3000";
            proxy_set_header Host "localhost:4000";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cookie_path / "/";
        }
    }
