# Default values for postgres.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This will set the replicaset count more information can be found here: https://kubernetes.io
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io
image:
  repository: postgres
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "16-alpine"

fullnameOverride: "postgres"

# Configuration variables for the PostgreSQL container layer
# These are mapped cleanly from the global values passed by the main umbrella root chart
auth:
  user: "syncseatapp"
  password: "syncseatapp"
  database: "syncseatapp"

# This is for setting up a service more information can be found here: https://kubernetes.io
service:
  # This sets the service type more information can be found here: https://kubernetes.io#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io#field-spec-ports
  port: 5432

persistence:
  # This sets the persistence for the postgres database more information can be found here: https://kubernetes.io
  enabled: true
  # This sets the storage class for the postgres database more information can be found here: https://kubernetes.io#class
  storageClass: ""
  # This sets the access mode for the postgres database more information can be found here: https://kubernetes.io#access-modes
  accessMode: ReadWriteOnce
  # This sets the size of the postgres database more information can be found here: https://kubernetes.io#capacity
  size: 5Gi
  # The explicit absolute path where Postgres stores internal transactional indices
  mountPath: /var/lib/postgresql/data

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Startup probes ensure that large initial database tables can cleanly mount without crashing early
startupProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 30

livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 5

readinessProbe:
  enabled: true
  initialDelaySeconds: 15
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

nodeSelector: {}

tolerations: []

affinity: {}
