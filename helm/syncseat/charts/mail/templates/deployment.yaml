apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mail.fullname" . }}
  labels:
    {{- include "mail.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mail.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mail.selectorLabels" . | nindent 8 }}
    spec:
      {{- if .Values.initContainers.enabled }}
      initContainers:
        {{- range .Values.initContainers.dependencies }}
        - name: wait-for-{{ .name }}
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for {{ .name }}:{{ .port }}..."
              # CoreDNS handles internal host discovery flawlessly
              until nc -z {{ .name }} {{ .port }}; do
                echo "{{ .name }}:{{ .port }} is not ready. Retrying..."
                sleep 2
              done
              echo "{{ .name }}:{{ .port }} is ready."
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          securityContext:
            runAsNonRoot: true
            # Safe runtime execution signatures for Alpine Node distribution
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          
          
          # ======================================================
          # ENVIRONMENT VARIABLE INJECTION FROM KUBERNETES SECRET
          # ======================================================
          envFrom:
            {{- if .Values.secret.enabled }}
            - secretRef:
                name: {{ required "secret.existingSecret must be set when secret.enabled=true" .Values.secret.existingSecret }}
            {{- end }}

          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
