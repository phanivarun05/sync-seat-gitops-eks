apiVersion: v1
kind: Service

metadata:
  name: {{ include "mail.fullname" . }}
  labels:
    {{- include "mail.labels" . | nindent 4 }}

spec:
  type: {{ .Values.service.type }}

  selector:
    {{- include "mail.selectorLabels" . | nindent 4 }}

  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP